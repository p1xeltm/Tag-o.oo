<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Tag o.oo</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@50..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="themes.css">
</head>

<body data-theme="orbeafoxfactory26">

    <div class="dashboard">

        <h1>tag-0null</h1>

        <div class="statistik-container-gesamt">
            <div class="statistik-block-links" id="monate-tage-block"></div>
            
            <div class="statistik-block-rechts">
                <span class="statistik-zahl" id="tages-zahl">0</span>
                <span class="statistik-text" id="tages-label">tage</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="bar-bg" id="bg">
                <div id="fill" class="bar-fill"></div>
            </div>
        </div>
       
        <div id="milestones-archive-content"></div>

        <div class="footer">
            <span class="version-tag">v1.6.91</span>
            
            <a href="https://github.com/p1xeltm/Tag-o.oo"
            target="_blank"
            rel="noopener noreferrer">
                <img src="git-icon.svg" class="icon-git" alt="Git">
            </a>

        </div>

    </div>

    <script src="script.js" defer></script>

</body>
</html>
